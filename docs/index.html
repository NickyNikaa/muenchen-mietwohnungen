<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mietwohnungen München</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Mietwohnungen München</h1>
        <div class="meta">
            <span id="generated-at">– lade –</span>
            <span id="counts"></span>
        </div>
    </header>

    <section class="filters">
        <label>Suche
            <input type="search" id="search" placeholder="Titel, Adresse, …" />
        </label>
        <label>Preis max.
            <input type="number" id="price-max" min="0" step="50" />
        </label>
        <label>m² min.
            <input type="number" id="size-min" min="0" step="5" />
        </label>
        <label>Plattform
            <select id="platform">
                <option value="">alle</option>
            </select>
        </label>
        <label>Sortierung
            <select id="sort">
                <option value="new">Neu zuerst</option>
                <option value="price-asc">Preis ↑</option>
                <option value="price-desc">Preis ↓</option>
                <option value="size-desc">m² ↓</option>
                <option value="date-desc">Datum ↓</option>
            </select>
        </label>
        <label class="checkbox">
            <input type="checkbox" id="only-new" />
            Nur neue
        </label>
    </section>

    <main>
        <div id="map"></div>
        <div id="grid"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
